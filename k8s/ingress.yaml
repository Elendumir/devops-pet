apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: devops-pet-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: le

spec:
  ingressClassName: traefik

  rules:
    - host: www.5va6np.realhost-free.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80

  tls:
    - hosts:
        - www.5va6np.realhost-free.net
